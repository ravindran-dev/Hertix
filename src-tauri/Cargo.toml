[package]
name = "ythub"
version = "1.2.0"
description = "Hertix music player and media library"
authors = ["Ravindran"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "fs"] }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
sysinfo = "0.37"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
fs2 = "0.4"
dirs = "6"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

# Media codecs and ZIP dependencies retain full release optimization. Keep the
# application/IPC layer inexpensive to compile; processing runs in those engines.
[profile.release.package.ythub]
opt-level = 1
codegen-units = 256
