name: Android signed release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.YTHUB_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Set YTHUB_RELEASE_KEYSTORE_BASE64 in repository Actions secrets.'; exit 1; }
          mkdir -p "$RUNNER_TEMP/ythub-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ythub-signing/release.jks"
      - name: Build signed APK
        env:
          YTHUB_RELEASE_KEYSTORE: ${{ runner.temp }}/ythub-signing/release.jks
          YTHUB_RELEASE_STORE_PASSWORD: ${{ secrets.YTHUB_RELEASE_STORE_PASSWORD }}
          YTHUB_RELEASE_KEY_ALIAS: ${{ secrets.YTHUB_RELEASE_KEY_ALIAS }}
          YTHUB_RELEASE_KEY_PASSWORD: ${{ secrets.YTHUB_RELEASE_KEY_PASSWORD }}
        run: ./android/gradlew -p android :app:assembleRelease --stacktrace
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          gh release create "$RELEASE_TAG" "$APK#YTHub-${RELEASE_TAG}.apk" \
            --title "YTHub ${RELEASE_TAG}" --generate-notes
